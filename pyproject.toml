[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-index-tool"
version = "1.1.0"
description = "支持扫码登录、多账号轮换、批量查询和 CSV 导出的抖音指数桌面工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42,<47"]

[project.optional-dependencies]
desktop = ["pywebview==6.1"]
build = ["pywebview==6.1", "pyinstaller==6.21.0"]

[project.scripts]
douyin-index = "douyin_index_tool.cli:main"
douyin-index-gui = "douyin_index_tool.webview_gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
douyin_index_tool = ["webview_ui/*", "webview_ui/assets/*"]
